<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit photo - trainbelgium.com</title>
    <link rel="stylesheet" href="../css/style.css?v=20260524-2" />
    <script
      src="https://kit.fontawesome.com/9332905c2e.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
      <link
      rel="icon"
      type="image/svg+xml"
      href="../images/favicon-32x32.svg"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../images/favicon-16x16.svg"
      sizes="16x16"
    />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="../images/icon-512.svg" />
  </head>
  <body>
    <div id="navbar"></div>
    <main>
      <div class="container page-title">
        <h1>Submit photo</h1>
        <p>Share a train photo for review by moderators.</p>
      </div>
      <section class="container section" style="padding-top: 18px">
        <div class="card submit-card">
          <h2>Photo submission</h2>
          <form id="submitPhotoForm" class="login-form" novalidate>
            <label for="submitStation">Station</label>
            <div class="submit-operator-picker" id="submitStationPicker">
              <button class="submit-operator-clear" id="submitStationClear" type="button" aria-label="Clear station" hidden>&times;</button>
              <img id="submitStationSelectedFlag" class="submit-operator-selected-logo submit-station-selected-flag" src="" alt="Selected station flag" hidden />
              <input id="submitStation" name="station" type="text" placeholder="Type station..." required autocomplete="off" />
            </div>
            <div id="submitStationSuggestions" class="moderator-suggestions" hidden></div>
            <label>Composition</label>
            <div id="submitCompositionRows" class="submit-composition-rows"></div>
            <input id="submitTitle" name="title" type="hidden" />
            <label for="submitImageUrl">Image path or URL</label>
            <div class="profile-avatar-input-row">
              <input id="submitImageUrl" name="image" type="text" placeholder="../images/Belgium/..." required />
              <button class="btn btn-secondary" id="submitImagePickBtn" type="button">Choose file</button>
            </div>
            <input id="submitImageFile" name="image_file" type="file" accept="image/*" hidden />
            <label for="submitDate">Date</label>
            <input id="submitDate" name="date" type="text" placeholder="24/03/2025" maxlength="10" inputmode="numeric" required />
            <label for="submitOperator">Operator</label>
            <div class="submit-operator-picker" id="submitOperatorPicker">
              <button class="submit-operator-clear" id="submitOperatorClear" type="button" aria-label="Clear operator" hidden>&times;</button>
              <img id="submitOperatorSelectedLogo" class="submit-operator-selected-logo" src="" alt="Selected operator logo" hidden />
              <input id="submitOperator" name="operator" type="text" placeholder="Type operator..." required autocomplete="off" />
            </div>
            <div id="submitOperatorSuggestions" class="moderator-suggestions" hidden></div>
            <label for="submitNotes">Notes</label>
            <input id="submitNotes" name="notes" type="text" placeholder="Optional note for moderators" />
            <button class="btn btn-primary" type="submit">Send for review</button>
          </form>
          <p class="login-status" id="submitPhotoStatus" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
    <script src="../data/gallery/index.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
