<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos - trainbelgium.com</title>

    <link rel="stylesheet" href="../css/style.css?v=20260308-12" />
    <script
      src="https://kit.fontawesome.com/9332905c2e.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="../images/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="../images//favicon-16x16.png"
      sizes="16x16"
    />
    <link rel="apple-touch-icon" href="../images//apple-touch-icon.png" />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="../images//icon-512.png"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <div class="container page-title">
        <h1>Photos</h1>
        <p>A selection of trainspotting locations.</p>
      </div>

      <section class="container section" style="padding-top: 18px">
        <h2>Map</h2>
        <p class="muted" style="margin-bottom: 12px">
          Click a station marker to open the station gallery.
        </p>
        <div
          id="stationsMap"
          class="stations-map"
          aria-label="Station map"
        ></div>
      </section>

      <div class="container photos-toolbar-wrap" style="padding-bottom: 10px">
        <div class="photos-toolbar">
          <div class="photos-toolbar-actions">
            <button
              class="photos-reset-btn photos-sort-btn active"
              id="photoSortPlace"
              type="button"
              aria-label="Sort by location"
            >
              Sort by place
            </button>
            <button
              class="photos-reset-btn photos-sort-btn"
              id="photoSortCompany"
              type="button"
              aria-label="Sort by company"
            >
              Sort by company
            </button>
            <button
              class="photos-reset-btn"
              id="photoResetFilters"
              type="button"
              aria-label="Reset search and filters"
            >
              Reset
            </button>

            <div class="photos-filter-menu" id="photoFilterMenu">
              <button
                class="photos-filter-toggle"
                id="photoFilterToggle"
                type="button"
                aria-expanded="false"
                aria-controls="photoFilterPanel"
              >
                <span class="photos-filter-toggle-label">Filters</span>
                <strong class="photos-filter-toggle-value" id="photoFilterSummary">All filters</strong>
              </button>

              <div class="photos-filter-panel" id="photoFilterPanel" hidden>
                <div class="photos-filter-panel-head">
                  <span class="photos-filter-eyebrow">Refine gallery</span>
                  <h3>Filter results</h3>
                </div>

                <div class="photos-filter-grid">
                  <section class="photos-filter-group">
                    <h4>Country</h4>
                    <div class="filters" id="photoFilters">
                      <button class="filter-btn active" type="button" data-filter="all">
                        All
                      </button>

                      <button class="filter-btn" type="button" data-filter="austria">
                        Austria
                      </button>

                      <button class="filter-btn" type="button" data-filter="belgium">
                        Belgium
                      </button>

                      <button class="filter-btn" type="button" data-filter="france">
                        France
                      </button>

                      <button class="filter-btn" type="button" data-filter="germany">
                        Germany
                      </button>

                      <button class="filter-btn" type="button" data-filter="luxembourg">
                        Luxembourg
                      </button>

                      <button class="filter-btn" type="button" data-filter="netherlands">
                        Netherlands
                      </button>

                      <button class="filter-btn" type="button" data-filter="slovakia">
                        Slovakia
                      </button>

                      <button class="filter-btn" type="button" data-filter="united kingdom">
                        United Kingdom
                      </button>
                    </div>
                  </section>

                  <section class="photos-filter-group">
                    <h4>Operator</h4>
                    <div class="filters" id="photoOperatorFilters"></div>
                  </section>

                  <section class="photos-filter-group photos-filter-group-wide">
                    <h4>Train Type</h4>
                    <div class="filters" id="photoMaterialFilters"></div>
                  </section>
                </div>
              </div>
            </div>
          </div>

          <div class="photos-search">
            <div class="photos-search-shell">
              <input
                id="photoSearch"
                class="photos-search-input"
                type="search"
                placeholder="Search by train type, number, operator or city..."
                autocomplete="off"
              />
            </div>
          </div>
        </div>
      </div>

      <section class="container section" style="padding-top: 18px">
        <div class="photos-gallery-head">
          <h2>Gallery</h2>
          <div class="photos-breadcrumb-bar" id="photoBreadcrumbBar" hidden>
            <button
              class="photos-breadcrumb-back"
              id="photoBreadcrumbBack"
              type="button"
              aria-label="Go back one level"
            >
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <nav class="photos-breadcrumb" id="photoBreadcrumb" aria-label="Gallery navigation"></nav>
          </div>
        </div>

        <div class="photo-grid" id="photoGrid">
          <!-- Station cards are generated from data/gallery. -->
        </div>

        <p class="no-results" id="noResults" style="display: none">
          No photos found in this category (yet).
        </p>
      </section>
    </main>

    <div id="footer"></div>

    <script src="../js/loadComponents.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="../data/gallery/index.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
