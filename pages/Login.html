<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - trainbelgium.com</title>

    <link rel="stylesheet" href="../css/style.css?v=20260524-1" />
    <script
      src="https://kit.fontawesome.com/9332905c2e.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      href="../images/favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="../images/favicon-16x16.png"
      sizes="16x16"
    />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../images/icon-512.png" />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <div class="container page-title">
        <h1>Login</h1>
        <p>Sign in with your username and password.</p>
      </div>

      <section class="container section login-section">
        <div class="card login-card login-shell">
          <div class="login-tabs" role="tablist" aria-label="Account actions">
            <button
              class="login-tab active"
              type="button"
              id="loginTabSignIn"
              data-login-tab="signin"
              aria-selected="true"
            >
              Sign in
            </button>
            <button
              class="login-tab"
              type="button"
              id="loginTabCreate"
              data-login-tab="create"
              aria-selected="false"
            >
              Create account
            </button>
          </div>

          <div class="login-panel" id="loginPanelSignIn">
            <h2>Account login</h2>

            <form class="login-form" id="loginSignInForm" novalidate>
              <label for="signinUsername">Username</label>
              <input
                id="signinUsername"
                name="username"
                type="text"
                autocomplete="username"
                required
                placeholder="Enter your username"
              />

              <label for="signinPassword">Password</label>
              <input
                id="signinPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
              />

              <button class="btn btn-primary" type="submit">Login</button>
            </form>
          </div>

          <div class="login-panel" id="loginPanelCreate" hidden>
            <h2>Create account</h2>

            <form class="login-form" id="loginCreateForm" novalidate>
              <label for="createUsername">Username</label>
              <input
                id="createUsername"
                name="username"
                type="text"
                autocomplete="username"
                required
                minlength="3"
                placeholder="Choose a username"
              />

              <label for="createEmail">Email</label>
              <input
                id="createEmail"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="Enter your email"
              />

              <label for="createPassword">Password</label>
              <input
                id="createPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="6"
                placeholder="Choose a password"
              />

              <label for="createPasswordConfirm">Confirm password</label>
              <input
                id="createPasswordConfirm"
                name="password_confirm"
                type="password"
                autocomplete="new-password"
                required
                minlength="6"
                placeholder="Repeat your password"
              />

              <button class="btn btn-primary" type="submit">Create account</button>
            </form>
          </div>

          <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
     
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="../js/loadComponents.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
