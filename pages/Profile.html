<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - trainbelgium.com</title>
    <link rel="stylesheet" href="../css/style.css?v=20260524-2" />
    <script
      src="https://kit.fontawesome.com/9332905c2e.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
      <link
      rel="icon"
      type="image/svg+xml"
      href="../images/favicon-32x32.svg"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../images/favicon-16x16.svg"
      sizes="16x16"
    />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="../images/icon-512.svg" />
  </head>
  <body>
    <div id="navbar"></div>
    <main>
      <div class="container page-title">
        <h1>Profile</h1>
        <p>Manage your account settings and moderation access.</p>
      </div>
      <section class="container section" style="padding-top: 18px">
        <div class="profile-grid">
          <div class="card profile-summary-card">
            <button class="profile-avatar-wrap" id="profileAvatarTrigger" type="button" aria-label="Change profile photo">
              <img id="profileAvatarPreview" src="../images/default-avatar.svg" alt="Profile avatar" />
              <span class="profile-avatar-overlay">Adjust profile photo</span>
            </button>
            <h2 id="profileSummaryName">Guest</h2>
            <p class="muted" id="profileSummaryMeta">Not logged in</p>
            <div class="badges">
              <span class="badge" id="profileRoleBadge">Member</span>
            </div>
            <p class="muted profile-summary-note">Tip: choose a clear profile photo so your comments are easier to recognize.</p>
          </div>

          <div class="card submit-card">
            <div class="submit-row">
              <h2>My profile</h2>
              <button class="btn btn-secondary" type="button" id="profileLogoutBtn">Log out</button>
            </div>
            <form id="profileForm" class="login-form" novalidate>
              <label for="profileUsername">Username</label>
              <input id="profileUsername" name="username" type="text" readonly />
              <input id="profileAvatarFile" name="avatar_file" type="file" accept="image/*" hidden />
              <label for="profileEmail">Email</label>
              <input id="profileEmail" name="email" type="email" placeholder="you@example.com" required />
              <label class="profile-toggle">
                <input id="profileNotifications" name="notifications" type="checkbox" />
                <span>Email notifications (coming soon)</span>
              </label>
              <button class="btn btn-primary" type="submit">Save profile</button>
            </form>
            <p class="login-status" id="profileStatus" role="status" aria-live="polite"></p>
          </div>

          <div class="card submit-card profile-moderator-card" id="moderatorManagementCard" hidden>
            <h2>Moderator management</h2>
            <p class="muted" style="margin-bottom: 10px">
              Only owner can assign or remove moderators.
            </p>
            <form id="moderatorAssignForm" class="login-form" novalidate>
              <label for="moderatorUsername">Username to promote</label>
              <input id="moderatorUsername" name="moderator_username" type="text" placeholder="Type username..." required autocomplete="off" />
              <div id="moderatorSuggestions" class="moderator-suggestions" hidden></div>
              <button class="btn btn-primary" type="submit" id="moderatorAddBtn" disabled>Add moderator</button>
            </form>
            <p class="login-status" id="moderatorAssignStatus" role="status" aria-live="polite"></p>
            <div id="moderatorList" class="moderation-list" style="margin-top: 12px"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="footer"></div>
    <script src="../js/loadComponents.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
